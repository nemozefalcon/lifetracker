<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="theme-color" content="#F5F6F7">
<title>Daily Tracker</title>
<style>
:root{--bg:#F5F6F7;--page:#E8EAEC;--card:#FFFFFF;--tx:#14191D;--mu:#67717A;--ln:#E1E4E7;--seg:#EBEEF0;--ac:#3B6FE0;--ma:#E8590C;--w:640px;
 --num:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
 --f:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color-scheme:light dark}
@media(prefers-color-scheme:dark){:root{--bg:#0E1114;--page:#07090B;--card:#161A1E;--tx:#ECEFF2;--mu:#8B949C;--ln:#262B30;--seg:#1E2328;--ac:#7BA0FF;--ma:#FF922B}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;touch-action:manipulation}
html,body{margin:0;background:var(--page);color:var(--tx);font:15px/1.4 var(--f);-webkit-font-smoothing:antialiased;overflow-x:hidden}
body{min-height:100vh;min-height:100dvh}
button{font:inherit;font-size:14px;font-weight:600;color:var(--tx);background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:10px 16px;cursor:pointer}
button:hover{border-color:var(--mu)}
button.pri{background:var(--tx);border-color:var(--tx);color:var(--card)}
button:focus-visible,.day:focus-visible,.wrow:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
input:focus-visible,textarea:focus-visible{outline:none}
.app{max-width:var(--w);min-height:100dvh;margin:0 auto;background:var(--bg);padding-bottom:calc(92px + env(safe-area-inset-bottom));overflow-x:hidden}
@media(min-width:641px){.app{box-shadow:0 0 0 1px var(--ln)}}
main{padding:0}
#st{margin:0;padding:14px 16px 0;font-size:12px;color:var(--mu);min-height:1.5em}

/* headers */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:calc(22px + env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 14px max(16px,env(safe-area-inset-left))}
h1{margin:0;font:700 34px/1 var(--f);letter-spacing:-.015em}
h1 small{font:400 15px var(--f);color:var(--mu);letter-spacing:0;margin-left:8px}
.ctrl{display:flex;align-items:center;gap:4px}
.ctrl .ib{width:40px;height:40px;border-radius:50%;padding:0;display:grid;place-items:center}
.ctrl .tx{background:none;border:0;height:40px;padding:0 10px}
.ib svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* calendar */
.dow{display:grid;grid-template-columns:repeat(7,1fr);padding:0 12px 6px;font-size:11px;font-weight:600;color:var(--mu)}
.dow span{padding-left:6px}
.band{background:var(--card);border-top:1px solid var(--ln);border-bottom:1px solid var(--ln)}
.grid{display:grid;grid-template-columns:repeat(7,1fr);padding:0 12px}
.day{height:74px;padding:5px 2px 6px 6px;text-align:left;display:flex;flex-direction:column;align-items:flex-start;border:0;border-top:1px solid var(--ln);border-radius:0;background:none;font-weight:400}
.day:nth-child(-n+7){border-top:0}
button.day:hover{border-color:var(--ln);background:var(--seg)}
.day .n{width:22px;height:22px;margin-left:-4px;display:grid;place-items:center;border-radius:50%;font-size:12px;font-weight:600;color:var(--mu)}
.day.has .n{color:var(--tx)}
.day.today .n{background:var(--tx);color:var(--card)}
.day .w{margin-top:1px;font:500 14px/1.2 var(--num);font-variant-numeric:tabular-nums}
.dots{display:flex;flex-wrap:wrap;gap:3px;margin-top:auto;max-width:44px}
.dot{width:6px;height:6px;border-radius:50%;background:var(--cc,#8a8a82)}
.more{font-size:9px;line-height:6px;color:var(--mu);font-weight:700}
.sum{padding:18px 16px 8px}
.sum h2{margin:0 0 10px;font:600 13px var(--f);color:var(--mu)}
.sum .row{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-start}
.sum .tg{margin:0}

/* week */
.wrow{display:grid;grid-template-columns:48px 1fr auto;gap:10px;align-items:start;padding:14px 16px;text-align:left;width:100%;border:0;border-top:1px solid var(--ln);border-radius:0;background:none;font-weight:400}
.wrow:first-child{border-top:0}
button.wrow:hover{border-color:var(--ln);border-top-color:var(--ln);background:var(--seg)}
.wrow .d{font-size:11px;font-weight:600;color:var(--mu)}
.wrow .dn{font:500 24px/1.1 var(--num)}
.wrow.today .dn{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px}
.tags{display:flex;flex-wrap:wrap;gap:5px;min-height:22px}.tags .tg{margin:0}
.wnote{font-size:12px;color:var(--mu);margin-top:6px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.wrow .kg{font:500 17px var(--num);font-variant-numeric:tabular-nums}
.wrow .kg small{font:400 11px var(--f);color:var(--mu);margin-left:2px}
.empty{color:var(--mu);font-size:13px;padding-top:3px}

/* weight */
.hero{padding:0 16px 16px}
.when{font-size:13px;color:var(--mu);min-height:20px;display:flex;gap:10px;align-items:center}
.when button{background:none;border:0;padding:0;font-size:13px;color:var(--ac)}
.hero .line{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-top:2px}
.big{font:500 64px/1 var(--num);letter-spacing:-.06em;font-variant-numeric:tabular-nums}
.big small{font:400 20px var(--f);letter-spacing:0;color:var(--mu);margin-left:6px}
.trend{font:500 17px var(--num);padding-bottom:8px;text-align:right;font-variant-numeric:tabular-nums}
.trend small{display:block;font:400 11px var(--f);color:var(--mu)}
.legend{display:flex;flex-wrap:wrap;gap:4px 18px;margin-top:14px;font-size:13px}
.legend span{display:inline-flex;align-items:center;gap:7px}
.legend b{font-family:var(--num);font-weight:500;font-variant-numeric:tabular-nums}
.sw-d{width:9px;height:9px;border-radius:50%;background:var(--ac)}
.sw-l{width:20px;height:3.5px;border-radius:2px;background:var(--ma)}
.chart{display:block;width:100%;height:auto;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.chart text{font:10.5px var(--f);fill:var(--mu)}
.ctl{display:flex;justify-content:space-between;align-items:center;padding:12px 16px 4px}
.rng{display:flex;gap:6px}
.rng button{background:none;border:0;border-bottom:2px solid transparent;border-radius:0;font-size:14px;color:var(--mu);height:36px;padding:0 10px}
.rng button[aria-pressed=true]{color:var(--tx);border-color:var(--tx)}
.step{display:flex;align-items:center;border:1px solid var(--ln);border-radius:999px;background:var(--card)}
.step button{width:40px;height:36px;padding:0;border:0;background:none;font-size:18px;display:grid;place-items:center;border-radius:999px}
.step output{min-width:44px;text-align:center;font:500 15px var(--num)}
.note{margin:0;padding:6px 16px 0;font-size:12.5px;color:var(--mu)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);margin-top:16px}
.stats div{padding:14px 16px;border-left:1px solid var(--ln)}
.stats div:first-child{border-left:0}
.stats small{display:block;font-size:12px;color:var(--mu)}
.stats b{font:500 24px/1.2 var(--num);font-variant-numeric:tabular-nums}

/* tab bar */
.tabbar{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(100%,var(--w));background:var(--card);border-top:1px solid var(--ln);display:flex;align-items:center;gap:2px;padding:8px 10px calc(8px + env(safe-area-inset-bottom));z-index:10}
.tab{flex:1;height:52px;border:0;background:none;border-radius:14px;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600;color:var(--mu)}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab:hover{border:0;color:var(--tx)}
.tab.on{color:var(--tx);background:var(--seg)}
.fab{width:52px;height:52px;border-radius:50%;padding:0;background:var(--tx);color:var(--card);border-color:var(--tx);display:grid;place-items:center;margin-left:4px;flex:none}
.fab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round}

/* sheets (all dialogs) */
dialog{border:0;border-radius:22px 22px 0 0;background:var(--card);color:var(--tx);width:100%;max-width:var(--w);max-height:90dvh;overflow:auto;padding:10px 20px calc(20px + env(safe-area-inset-bottom));margin:auto auto 0;animation:up .24s cubic-bezier(.2,.8,.2,1)}
dialog::backdrop{background:rgba(8,10,12,.5);animation:fade .18s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:0}}
@keyframes fade{from{opacity:0}}
dialog h3{margin:0;font:700 24px/1.15 var(--f)}
.grab{width:38px;height:4px;border-radius:2px;background:var(--ln);margin:0 auto 14px}
dialog>h3:first-child{margin-top:10px}
dialog h3+label,dialog h3+.row{margin-top:14px}
label{display:block;font-size:12px;font-weight:500;color:var(--mu)}
input,textarea{font:inherit;font-size:16px;width:100%;padding:10px 12px;margin:5px 0 12px;border:1px solid var(--ln);border-radius:12px;background:var(--bg);color:var(--tx);outline:none}
input:focus,textarea:focus{border-color:var(--ac);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 22%,transparent)}
.row{display:flex;gap:8px;justify-content:flex-end}
.wfield{display:flex;align-items:baseline;gap:8px;border-bottom:1px solid var(--ln);margin:14px 0 4px}
.wfield input{flex:1;min-width:0;font:500 44px/1.2 var(--num);background:none;border:0;border-radius:0;color:var(--tx);padding:0;margin:0;box-shadow:none;font-variant-numeric:tabular-nums;-moz-appearance:textfield}
.wfield input::-webkit-outer-spin-button,.wfield input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.wfield input::placeholder{color:var(--ln)}
.wfield span{font-size:16px;color:var(--mu)}
.wfield:focus-within{border-color:var(--ac)}
.fam{margin:16px 0 8px;font-size:12px;font-weight:600;color:var(--mu)}
.tgs{display:flex;flex-wrap:wrap;gap:8px}.tgs .tg{margin:0}
.field{display:block;width:100%;margin:14px 0 0;font-size:16px;color:var(--tx);background:none;border:0;border-bottom:1px solid var(--ln);border-radius:0;padding:8px 0;resize:none}
.field:focus{box-shadow:none;border-color:var(--ac)}
.field::placeholder{color:var(--mu)}
#dlg .tg{height:30px;font-size:13px;padding:0 12px 0 8px;border-radius:10px;cursor:pointer}
#dlg .tg .ic{width:14px;height:14px}
.warn{margin:10px 0 0;font-size:13px;color:var(--tx);background:color-mix(in srgb,#f2c931 28%,transparent);border-left:3px solid #f2c931;padding:8px 10px}
.acts{display:flex;gap:10px;margin-top:20px}
.acts button{flex:1;height:48px;font-size:16px;border-radius:12px}

#lock{position:fixed;inset:0;background:var(--bg);z-index:30;display:flex;align-items:center;justify-content:center;padding:24px}
#lock>div{width:min(100%,340px)}
#lock h2{margin:0 0 20px;font:700 38px/1 var(--f);letter-spacing:-.02em}
#go{width:100%;height:48px;font-size:16px}
#err{display:block;margin-top:8px;font-size:13px;color:#d4452f}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
/* ===== Tag chips (uploaded design). --cc = colour, --tt = text colour. Five styles: filled (default), alpha, nofill, alphadash, nofilldash ===== */
.tg{position:relative;display:inline-flex;align-items:center;gap:4px;overflow:hidden;height:22px;box-sizing:border-box;padding:0 8px 0 4px;margin:0 4px 4px 0;border:1px solid var(--cc,#8a8a82);border-radius:8px;background:var(--cc,#8a8a82);color:var(--tt,#1a1a1a);font-size:11.5px;line-height:20px;font-weight:600;white-space:nowrap;cursor:default}
.tg::before{content:'';position:absolute;inset:0;background:linear-gradient(90deg,rgba(255,255,255,.24),rgba(255,255,255,0));pointer-events:none}
.tg>*{position:relative}.tg .ic{width:12px;height:12px;flex:none}
.tg.alpha{background:color-mix(in srgb,var(--cc) 26%,transparent);color:var(--tx)}
.tg.nofill{background:transparent;color:var(--tx);border-width:1.5px}
.tg.alphadash{background:color-mix(in srgb,var(--cc) 26%,transparent);color:var(--tx);border:1.5px dashed var(--cc)}
.tg.nofilldash{background:transparent;color:var(--tx);border:1.5px dashed var(--cc)}
.tg.alpha::before,.tg.nofill::before,.tg.alphadash::before,.tg.nofilldash::before{display:none}
.tg.low .lb::after{content:" ?";font-weight:700}
.tg.hidden{opacity:.6;text-decoration:line-through;border-style:dotted;background:var(--card);color:var(--tx)}.tg.hidden::before{display:none}
.tg:focus-visible{outline:2px solid var(--tx);outline-offset:2px}
.tgok{margin:0 -4px 0 2px;padding:0;width:15px;height:15px;line-height:13px;border-radius:50%;border:1px solid currentColor;background:rgba(255,255,255,.85);color:#2f6600;font-size:10px;font-weight:700;cursor:pointer;flex:none}
.tgok:hover{background:#76b900;color:#000;border-color:#000}
.tgmore{display:inline-flex;align-items:center;gap:5px;vertical-align:top;height:22px;margin:0 0 4px;padding:0 8px;border:1.5px solid var(--tx);border-radius:8px;background:transparent;color:var(--tx);font:inherit;font-size:11.5px;font-weight:600;cursor:pointer}
.tgmore::after{content:'';border-left:4px solid transparent;border-right:4px solid transparent;border-top:5px solid currentColor}
.tgmore.up::after{border-top:0;border-bottom:5px solid currentColor}.tgmore:hover{background:var(--tx);color:var(--card)}
/* palette: all 18 colours with their text colours */
.c-water{--cc:#4a8fe0;--tt:#1a1a1a}.c-grass{--cc:#4e9d3e;--tt:#1a1a1a}.c-dragon{--cc:#5568b8;--tt:#ffffff}.c-fairy{--cc:#dc8fdc;--tt:#1a1a1a}.c-electric{--cc:#f2c931;--tt:#1a1a1a}.c-ground{--cc:#a0723a;--tt:#ffffff}.c-rock{--cc:#aba383;--tt:#1a1a1a}.c-fighting{--cc:#e0922d;--tt:#1a1a1a}.c-bug{--cc:#8fb23a;--tt:#1a1a1a}.c-dark{--cc:#5b4f46;--tt:#ffffff}.c-fire{--cc:#e0613e;--tt:#1a1a1a}.c-flying{--cc:#8aa8d8;--tt:#1a1a1a}.c-ghost{--cc:#5f4a7a;--tt:#ffffff}.c-ice{--cc:#6ec6cc;--tt:#1a1a1a}.c-normal{--cc:#8a8a82;--tt:#1a1a1a}.c-poison{--cc:#9b59c9;--tt:#ffffff}.c-psychic{--cc:#e8708f;--tt:#1a1a1a}.c-steel{--cc:#8aa8bc;--tt:#1a1a1a}
</style></head><body>
<div id="lock"><div><h2>Daily Tracker</h2>
<input id="pw" type="password" placeholder="Password (first time: choose one)" autocomplete="current-password">
<button class="pri" id="go">Unlock</button> <span id="err"></span><p style="margin:14px 0 0"><a href="#" id="rs" style="color:var(--mu);font-size:13px">Forgot it? Start over on this device</a></p>
<p style="color:var(--mu);font-size:13px">Data is encrypted in your browser. A forgotten password cannot be recovered.<br>Version 12</p></div></div>
<div class="app"><main id="main"></main><p id="st" role="status"></p></div>
<nav class="tabbar" aria-label="Sections">
<button class="tab on" data-t="cal"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7a2 2 0 012-2h12a2 2 0 012 2v11a2 2 0 01-2 2H6a2 2 0 01-2-2V7zM4 10h16M8 3v4M16 3v4"/></svg>Calendar</button>
<button class="tab" data-t="wk"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>Week</button>
<button class="tab" data-t="wt"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19V5M4 19h16M7 14l4-4 3 3 5-6"/></svg>Weight</button>
<button class="tab" id="cfg"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg>Settings</button>
<button class="fab" id="fab" aria-label="Log today"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
</nav>
<dialog id="dlg"><div class="grab"></div><h3 id="dt"></h3>
<label class="wfield"><input id="dw" type="number" step="0.1" inputmode="decimal" placeholder="0.0" aria-label="Weight in kilograms"><span>kg</span></label>
<div id="pick"></div><div id="warn"></div>
<div class="fam">Your own tags</div><div id="chips" class="tgs"></div>
<input class="field" id="dn" list="dl" placeholder="Add a tag"><datalist id="dl"></datalist>
<textarea class="field" id="dnote" rows="2" placeholder="Note"></textarea>
<div class="acts"><button id="x1">Cancel</button><button class="pri" id="ok">Save</button></div></dialog>
<dialog id="sd"><div class="grab"></div><h3>Settings</h3>
<div class="fam" style="margin-top:14px">GitHub sync</div><label>Repo (owner/name)<input id="sr"></label><label>Branch<input id="sb" placeholder="main"></label>
<label>Fine-grained token (Contents: read/write)<input id="stk" type="password"></label>
<div class="row" style="justify-content:flex-start;flex-wrap:wrap;margin-bottom:10px"><button id="imp">Import weights</button><button id="csv">Export CSV</button></div><label>Change password<input id="op" type="password" placeholder="Current password" autocomplete="off"><input id="np" type="password" placeholder="New password (8+ characters)" autocomplete="off"></label><div class="row" style="justify-content:flex-start;margin:-4px 0 14px"><button id="cp">Change password</button><span id="cm" style="font-size:13px;color:var(--mu)"></span></div><div class="row"><button id="dl2">Download file</button><button id="x2">Close</button><button class="pri" id="sv2">Save</button></div></dialog>
<dialog id="imd"><div class="grab"></div><h3>Import weights</h3><label>One per line: date, then kg (2026-11-20 79.6)<textarea id="it" rows="9" placeholder="2026-11-20 79.6"></textarea></label><div class="row"><button id="x3">Cancel</button><button class="pri" id="im">Import</button></div></dialog>
<script>
let freshMem=false;try{localStorage.getItem('t')}catch(e){Object.defineProperty(window,'localStorage',{value:{},configurable:true})}
const $=s=>document.querySelector(s),esc=s=>s.replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
let key,salt,db={days:{}},view=new Date(),tab='cal',sel,tg=[],rng=90,PT=[],ma=Math.max(3,+localStorage.ma||14),wk=sow(new Date());
const cfg=()=>JSON.parse(localStorage.cfg||'{}'),st=t=>$('#st').textContent=t;
const b64=b=>{let s='';for(const x of new Uint8Array(b))s+=String.fromCharCode(x);return btoa(s)},ub=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const FAM={Food:['grass',['Fruit and veg','Ate in moderation','Ate breakfast','Greasy food']],Sleep:['poison',['Good sleep','Bad sleep']],Exercise:['fighting',['Yoga','Swim','Run','Strength']],Mood:['water',['Happy','Calm','Energetic','Tired','Anxious','Low']]};
const fam=t=>Object.keys(FAM).find(f=>FAM[f][1].includes(t)),cls=t=>{if(t=='Greasy food')return'electric';const f=fam(t);return f?FAM[f][0]:'normal'};
const IC='<svg width="12" height="12" aria-hidden="true" viewBox="0 0 24 24" stroke="currentColor" fill="none" class="ic"><path d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg>',
 chip=(t,x='',a='',sfx='')=>`<span class="tg c-${cls(t)} ${x}" ${a}>${IC}<span class=lb>${esc(t)}${sfx}</span></span>`;
function sow(d){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-x.getDay());return x}
async function derive(pw,s){const m=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
return crypto.subtle.deriveKey({name:'PBKDF2',salt:s,iterations:250000,hash:'SHA-256'},m,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function enc(){const iv=crypto.getRandomValues(new Uint8Array(12));

async function unlock2(){
 if(!crypto.subtle){$('#err').textContent='Encryption is not available here. Open the file in Chrome or Safari, or from your GitHub Pages link.';return}

 if(localStorage.fresh==='1'||freshMem)raw=null;else if(localStorage.dirty!=='1'){try{const r=await fetch('data.enc.json?'+Date.now());if(r.ok)raw=await r.text()}catch(e){}}
 try{
  if(raw){const o=JSON.parse(raw);salt=ub(o.salt);key=await derive(pw,salt);
   db=JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:ub(o.iv)},key,ub(o.ct))))}
  else{salt=crypto.getRandomValues(new Uint8Array(16));key=await derive(pw,salt)}
 }catch(e){$('#err').textContent='Wrong password';return}

function merge(r){let c=0;for(const k in r.days||{}){const a=db.days[k],b=r.days[k];if(!a||(b.u||0)>(a.u||0)){db.days[k]=b;c=1}}return c}
async function save(){
 const c=cfg();let blob=await enc();localStorage.blob=blob;localStorage.dirty='1';localStorage.fresh='';
 if(!c.repo||!c.token){st('Saved in this browser. Set up GitHub sync in ⚙ to publish.');return}
 const u=`https://api.github.com/repos/${c.repo}/contents/data.enc.json`,br=c.branch||'main',h={Authorization:'Bearer '+c.token,Accept:'application/vnd.github+json'};

   try{const o=JSON.parse(atob(j.content.replace(/\n/g,'')));if(o.salt==b64(salt)){const r=JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:ub(o.iv)},key,ub(o.ct))));if(merge(r))render();blob=await enc();localStorage.blob=blob}}catch(e){}}

const RK=['Exercise','Food','Sleep','Mood'],rk=t=>{const i=RK.indexOf(fam(t));return i<0?9:i},

 W=390,H=252,L=16,R=40,T=14,B=28,X=t=>L+(t-t0)/((t1-t0)||1)*(W-L-R),Y=v=>T+(hi-v)/(hi-lo)*(H-T-B),

 p.forEach(x=>{if(x[2]==null){if(cur.length)seg.push(cur);cur=[]}else cur.push(x)});if(cur.length)seg.push(cur);

 const ap=p.filter(x=>x[2]!=null),ch=ap.length>1?ap.at(-1)[2]-ap[0][2]:null,sd=ap.length>1?(+ap.at(-1)[0]-+ap[0][0])/864e5:0,pw=ch!=null&&sd>0?ch/sd*7:null,

 ${ctlHTML()}${note?`<p class=note>${note}</p>`:''}
 <div class="band stats"><div><small>Latest</small><b>${p.at(-1)[1].toFixed(1)}</b></div><div><small>Avg change</small><b>${sg(ch)}</b></div><div><small>Weigh-ins</small><b>${p.length}</b></div></div>`;

function cnt(a,b){const m={};for(let d=new Date(a);d<=b;d.setDate(d.getDate()+1)){const r=db.days[iso(d)];(r&&r.t||[]).forEach(t=>m[t]=(m[t]||0)+1)}return m}
